<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Misterios del rosario</title>
  <style>
    html { background: #faf8f3; color: #302922; }
    body { max-width: 32rem; margin: 0 auto; padding: 2rem 1.25rem; }
    dl { margin: 0; }
    dl > div { padding: 1.25rem 0; border-bottom: 1px solid #d8d1c5; }
    dt { font: bold 1.5rem/1.3 Georgia, serif; }
    dd { margin: .35rem 0 0; font: 1.125rem/1.5 system-ui, sans-serif; }
  </style>
</head>
<body>
  <main aria-label="Índice de los misterios del rosario">
    <dl>
      <div><dt>Misterios gozosos</dt><dd>Lunes y sábado</dd></div>
      <div><dt>Misterios luminosos</dt><dd>Jueves</dd></div>
      <div><dt>Misterios dolorosos</dt><dd>Martes y viernes</dd></div>
      <div><dt>Misterios gloriosos</dt><dd>Miércoles y domingo</dd></div>
    </dl>
  </main>
</body>
</html>
