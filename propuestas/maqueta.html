<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El santo rosario · Maqueta</title><style>
*{box-sizing:border-box}body{--ink:#322b22;--accent:#833f32;--line:#c7bcaa;color:var(--ink);background:#fbf6eb;font:16px/1.55 system-ui;margin:0}main{max-width:1100px;margin:auto;padding:0 clamp(22px,5vw,64px) 30px}header,footer,.top{display:flex;align-items:center;justify-content:space-between;gap:12px}header{padding:20px 0;border-bottom:1px solid var(--line)}header b{font:600 21px Georgia}small,.tag{font:700 11px/1.6 system-ui;text-transform:uppercase;letter-spacing:.12em}.tag{color:var(--accent);display:block}h1,h2,h3,p{margin:0}h1{font:normal clamp(45px,6vw,76px)/1.03 Georgia;letter-spacing:-.045em;margin:14px 0 20px}h2{font:normal 30px/1.15 Georgia;margin:10px 0}h3{font:normal 22px Georgia}a,button,summary{cursor:pointer;color:inherit}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid currentColor;outline-offset:2px}.btn{display:inline-block;background:var(--accent);color:white;text-decoration:none;padding:13px 21px;border:0;border-radius:3px;font:600 15px system-ui;margin:20px 0 0}footer{border-top:1px solid var(--line);margin-top:28px;padding:14px 0;font:13px Georgia}ol{padding:0;list-style:none;counter-reset:item;margin:12px 0}li{counter-increment:item;display:flex;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font:17px/1.45 Georgia}li:before{content:counter(item,decimal-leading-zero);font:12px system-ui;color:var(--accent)}.spread{display:grid;grid-template-columns:1fr 1fr;gap:8%;padding-top:50px}.misal header{border-bottom:4px double var(--line)}.mark{color:var(--accent);font:26px Georgia;margin-bottom:14px}.intro{max-width:34ch}.semana{background:#f1f6ef;--ink:#153b2b;--accent:#216348;--line:#b8cbbb}.semana h1,.indice h1{font-family:system-ui;font-weight:700}.days{display:flex;gap:5px;margin:15px 0 25px}.days button{flex:1;border:1px solid var(--line);background:none;border-radius:8px;font:600 14px system-ui;padding:14px 0}.days button[aria-pressed=true]{background:var(--accent);color:white}.calendar{background:white;padding:clamp(18px,3vw,35px);border-radius:18px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.cuenta{background:#182b40;--ink:#fff2d5;--line:#506074;--accent:#e3be7c}.cuenta .btn{color:#182b40}.prayer{max-width:670px;text-align:center;margin:48px auto 0}.beads{margin:26px auto 36px;display:flex;align-items:center;justify-content:space-between;width:min(85%,350px);height:2px;background:var(--line)}.beads i{width:17px;height:17px;background:#182b40;border:2px solid #a29a85;border-radius:50%}.beads .on{background:var(--accent);outline:4px solid #e3be7c30}.prayer h1{font-size:clamp(38px,5.6vw,62px)}.back{display:block;margin:12px auto;background:none;border:0;color:inherit;padding:8px}.back:disabled{visibility:hidden}.vitral{background:#f7ede0;--accent:#994323;--line:#cbb8a6}.cover{display:grid;grid-template-columns:.85fr 1fr;align-items:center;gap:7%;padding:34px 0}.glass{width:100%;height:390px;display:block}.indice{background:#fcfcfa;--ink:#242722;--accent:#394f3d;--line:#c6cdc3}.indice summary{padding:15px 0;display:flex;align-items:center;justify-content:space-between;font:600 21px system-ui;list-style:none}.indice summary::after{content:'+'}.indice details[open] summary::after{content:'−'}.indice details{border-top:1px solid var(--line)}.pill{font:700 11px system-ui;background:#dce9d4;border-radius:12px;padding:4px 9px;margin-left:6px}.indice .btn{margin:3px 0 16px}

</style><main><header><b>✧ &nbsp;El santo rosario</b><small>Jueves · 26 nov.</small></header><article></article><footer><span>Guía de oración</span><a href="https://www.vatican.va/special/rosary/documents/misteri_sp.html">Fuente: Vaticano ↗</a></footer></main><script>
const groups=[['gozosos','gaudiosi','La Anunciación','La Visitación','El nacimiento de Jesús','La presentación de Jesús en el templo','El Niño Jesús perdido y hallado en el templo'],['dolorosos','dolorosi','La oración en el huerto','La flagelación de Jesús','La coronación de espinas','Jesús con la cruz a cuestas','La crucifixión y muerte de Jesús'],['gloriosos','gloriosi','La Resurrección','La Ascensión','La venida del Espíritu Santo','La Asunción de María','La coronación de María'],['luminosos','luminosi','El bautismo de Jesús en el Jordán','La autorrevelación de Jesús en las bodas de Caná','El anuncio del Reino de Dios','La Transfiguración de Jesús','La institución de la Eucaristía']];const url=g=>`https://www.vatican.va/special/rosary/documents/misteri_${g[1]}_sp.html`,btn=(g,t)=>`<a class="btn" href="${url(g)}">${t} →</a>`,list=g=>`<ol>${g.slice(2).map(s=>`<li>${s}</li>`).join('')}</ol>`,tag=t=>`<span class="tag">${t}</span>`,L=groups[3],page=document.querySelector('article');let idea=Number(new URLSearchParams(location.search).get('idea'))||1;document.body.className=['misal','semana','cuenta','vitral','indice'][idea-1];
if(idea===1)page.innerHTML=`<div class="spread"><section><div class="mark">❦</div>${tag('El rosario de hoy · Jueves')}<h1>Misterios<br><i>luminosos</i></h1><p class="intro">Hoy contemplamos cinco momentos de la vida pública de Jesús.</p>${btn(L,'Comenzar el rosario')}</section><section>${tag('Orden de la lectura')}${list(L)}</section></div>`;
if(idea===2){const days=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];page.innerHTML=`<h1>Esta semana</h1>${tag('23 — 29 de noviembre')}<div class="days">${days.map((s,i)=>`<button aria-label="${s} ${23+i}${i===3?', hoy':''}">${s.slice(0,2)}<br>${23+i}</button>`).join('')}</div><section class="calendar" aria-live="polite"></section>`;function pick(i){let g=groups[[0,1,2,3,1,0,2][i]];document.querySelectorAll('.days button').forEach((b,j)=>{b.setAttribute('aria-pressed',i===j);b.onclick=()=>pick(j)});document.querySelector('.calendar').innerHTML=`<div>${tag((i===3?'Hoy · ':'')+days[i])}<h2>Misterios ${g[0]}</h2>${btn(g,'Rezar este rosario')}</div>${list(g)}`}pick(3)}
if(idea===3){page.innerHTML=`<section class="prayer">${tag('Hoy · Misterios luminosos')}<div class="beads" aria-hidden="true"></div><div aria-live="polite"><small id="step"></small><h1 id="mystery"></h1></div><p>Un padrenuestro, diez avemarías y un gloria.</p><button class="btn" id="next"></button><button class="back" id="prev">← Anterior</button></section>`;let n=0;function draw(){step.textContent=`Misterio ${n+1} de 5`;mystery.textContent=L[n+2];document.querySelector('.beads').innerHTML=Array.from({length:5},(_,i)=>`<i class="${i===n?'on':''}"></i>`).join('');next.textContent=n===4?'Volver al primero ↺':'Siguiente misterio →';prev.disabled=n===0}next.onclick=()=>{n=(n+1)%5;draw()};prev.onclick=()=>{n--;draw()};draw()}
if(idea===4)page.innerHTML=`<div class="cover"><svg class="glass" viewBox="0 0 320 300" aria-hidden="true"><defs><clipPath id="arch"><path d="M12 297V143a148 140 0 0 1 296 0v154z"/></clipPath></defs><g clip-path="url(#arch)" stroke="#f7ede0" stroke-width="4"><path fill="#d68c57" d="M0 0h320v300H0z"/><path fill="#e4b873" d="M160 146L80 0h160z"/><circle cx="160" cy="144" r="52" fill="#f4d896"/><path fill="#497569" d="M-20 120q120 20 200 120t180 0v80H0z"/><path fill="#789689" d="M340 126Q190 160 80 310h260z"/><path fill="#284f53" d="M-20 203q130 1 290 110H0z"/><path fill="#89b8b2" d="M340 196q-154 33-188 120h188z"/></g></svg><section>${tag('Jueves / El rosario de hoy')}<h1>Los misterios<br><i>de la luz</i></h1><p class="intro">Comenzamos en el Jordán, con el bautismo de Jesús.</p>${btn(L,'Entrar en la contemplación')}</section></div>`;
if(idea===5)page.innerHTML=`<div class="spread"><section>${tag('Guía de consulta')}<h1>Los cuatro misterios</h1><p>Hoy jueves se rezan los <b>luminosos</b>.</p></section><section>${[3,0,1,2].map(i=>{let g=groups[i];return `<details ${i===3?'open':''}><summary><span>${g[0][0].toUpperCase()+g[0].slice(1)} ${i===3?'<span class="pill">HOY</span>':''}</span></summary>${tag(['Lunes y sábado','Martes y viernes','Miércoles y domingo','Jueves'][i])}${list(g)}${btn(g,'Ir a la lectura')}</details>`}).join('')}</section></div>`;
</script></html>
