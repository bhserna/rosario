<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinco caminos · Estudio del rosario</title>
<style>
*{box-sizing:border-box}body{background:#f4f2ed;color:#262924;font:16px/1.5 system-ui;margin:0}main{max-width:1480px;margin:auto;padding:clamp(16px,3vw,48px)}small,label{font:700 12px/2 system-ui;letter-spacing:.11em;text-transform:uppercase}h1{font:normal clamp(36px,5vw,66px)/1.06 Georgia;margin:12px 0}p{margin:10px 0 20px}nav{display:flex;gap:6px;flex-wrap:wrap;border-block:1px solid #bdbfb5;padding:14px 0}a{color:inherit}nav a,.open{padding:9px 14px;text-decoration:none;border-radius:22px}nav a[aria-current],.open{background:#263a30;color:white}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h2{font:normal 30px Georgia;margin-bottom:0}.views{display:grid;grid-template-columns:minmax(0,366fr) minmax(0,1024fr);gap:18px}.frame{overflow:hidden;border:1px solid #afb2a7;border-radius:12px;background:white}iframe{display:block;border:0;transform-origin:top left}label{display:block;margin-bottom:6px}@media(max-width:750px){.views{grid-template-columns:1fr}.mobile{max-width:390px}header{display:block}.open{display:inline-block;margin-bottom:18px}}
</style><main><small>Estudio de diseño · El santo rosario</small><h1>Cinco formas de empezar.</h1><p>Compara la entrada al rosario en móvil y escritorio. Todas usan el mismo jueves de ejemplo.</p><nav aria-label="Propuestas"></nav><header><div><h2></h2><p id="desc"></p></div><a class="open">Abrir a tamaño real ↗</a></header><div class="views"></div></main>
<script>
const concepts=[['Misal','La página de un libro: título, lectura y cinco misterios en orden.'],['Semana','Un calendario de siete días para encontrar el de hoy o consultar otro.'],['Cuenta a cuenta','Un misterio a la vez, con cuentas que indican cuánto falta.'],['Vitral','Una portada ilustrada que invita a entrar en la lectura.'],['Índice','Los cuatro grupos a la vista, con el de hoy abierto.']];
const nav=document.querySelector('nav'),views=document.querySelector('.views');concepts.forEach(([name],i)=>nav.insertAdjacentHTML('beforeend',`<a href="#${i+1}">0${i+1} · ${name}</a>`));for(const [name,w,h] of [['Móvil',366,734],['Escritorio',1024,710]]){let box=document.createElement('section');box.className=w===366?'mobile':'';box.innerHTML=`<label>${name} · ${w} px</label><div class="frame"><iframe title="Vista de ${name}" width="${w}" height="${h}"></iframe></div>`;views.append(box);let frame=box.lastChild;new ResizeObserver(()=>{let scale=frame.clientWidth/w;frame.style.height=h*scale+2+'px';frame.firstChild.style.transform=`scale(${scale})`}).observe(box)}function show(){let n=Number(location.hash.slice(1));if(!Number.isInteger(n)||n<1||n>5)n=1;document.querySelector('h2').textContent=`0${n} / ${concepts[n-1][0]}`;desc.textContent=concepts[n-1][1];[...nav.children].forEach((a,i)=>i===n-1?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));let url=`maqueta.html?idea=${n}`;document.querySelector('.open').href=url;document.querySelectorAll('iframe').forEach(f=>f.src=url)}onhashchange=show;show();</script></html>
